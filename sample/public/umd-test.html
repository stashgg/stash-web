<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stash Pay · UMD test page</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font: 14px/1.4 system-ui, sans-serif;
        background: #0c0b16;
        color: #eee;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .card {
        max-width: 560px;
        width: 100%;
        background: #161527;
        border: 1px solid #2a2840;
        border-radius: 12px;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        color: #a6a4c0;
      }
      button {
        background: #6366f1;
        color: white;
        border: 0;
        padding: 0.625rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
      }
      button:hover {
        background: #818cf8;
      }
      input {
        width: 100%;
        padding: 0.625rem;
        background: #0f0e1f;
        border: 1px solid #2a2840;
        border-radius: 8px;
        color: #fff;
        margin: 0.5rem 0 1rem;
        font-family: inherit;
      }
      pre {
        background: #0f0e1f;
        border: 1px solid #2a2840;
        border-radius: 8px;
        padding: 0.75rem;
        overflow: auto;
        max-height: 200px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Stash Pay — script-tag smoke test</h1>
      <p>
        Loads <code>stash-pay.umd.global.js</code> directly with no React, no
        bundler. Paste a live checkout URL to open it.
      </p>
      <input id="url" placeholder="https://checkout.stash.gg/..." />
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
        <button id="open-sheet">Open · bottom-sheet</button>
        <button id="open-modal">Open · center-modal</button>
        <button id="open-side">Open · side-panel-right</button>
      </div>
      <h3 style="margin-top: 1.5rem; font-size: 12px; opacity: 0.6">
        Callback log
      </h3>
      <pre id="log">(events will appear here)</pre>
    </div>

    <!-- Must be relative so the Next.js /public/ static assets work. -->
    <script src="./stash-pay.umd.global.js"></script>
    <script>
      const logEl = document.getElementById('log');
      const lines = [];
      const push = (name, payload) => {
        const ts = new Date().toISOString().slice(11, 23);
        lines.unshift(
          `[${ts}] ${name}` +
            (payload ? ` ${JSON.stringify(payload)}` : ''),
        );
        logEl.textContent = lines.slice(0, 20).join('\n');
      };

      const baseOptions = {
        onOpen: () => push('open'),
        onClose: () => push('close'),
        onReady: () => push('ready'),
        onSuccess: (e) => push('success', { orderId: e.orderId }),
        onFailure: (e) => push('failure', { errorCode: e.errorCode }),
        onProcessing: () => push('processing'),
        onError: (e) => push('error', { message: e.message }),
      };

      const openWith = (position) => {
        const url = document.getElementById('url').value.trim();
        if (!url) {
          alert('Paste a Stash checkout URL first.');
          return;
        }
        window.StashPay.open({
          checkoutUrl: url,
          position,
          ...baseOptions,
        });
      };

      document
        .getElementById('open-sheet')
        .addEventListener('click', () => openWith('bottom-sheet'));
      document
        .getElementById('open-modal')
        .addEventListener('click', () => openWith('center-modal'));
      document
        .getElementById('open-side')
        .addEventListener('click', () => openWith('side-panel-right'));
    </script>
  </body>
</html>
